<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nature Home for LG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101f2a;color:white;font-family:Arial,Helvetica,sans-serif}#photo,#shade{position:absolute;inset:0;width:100%;height:100%}#photo{background-size:cover;background-position:center;transition:opacity 1.5s;opacity:1}#shade{background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 38%,rgba(0,0,0,.78) 100%)}.top{position:absolute;top:5%;left:5%;right:5%;display:flex;justify-content:space-between;align-items:start}.brand{font-weight:600;letter-spacing:2px;font-size:22px}.clock{text-align:right;font-size:23px}.date{color:#d1dce3;font-size:15px;margin-top:4px}.welcome{position:absolute;left:7%;bottom:33%}.welcome h1{font-size:clamp(38px,5vw,84px);font-weight:500;margin:0 0 9px}.welcome p{font-size:clamp(16px,1.5vw,26px);color:#e2e8ed;margin:0}.dock{position:absolute;bottom:8%;left:4%;width:92%;background:rgba(17,25,33,.65);border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:22px 14px;display:flex;justify-content:space-around;gap:7px}.app{min-width:0;flex:1;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.13);border-radius:14px;border:3px solid transparent;color:white;font-size:clamp(13px,1.35vw,22px);font-weight:bold;min-height:76px;padding:8px 3px;outline:0}.app:focus,.app.active{border-color:white;background:rgba(255,255,255,.3);transform:scale(1.06)}.help{position:absolute;bottom:2.5%;width:100%;text-align:center;font-size:13px;color:#becad3}.fallback{background:linear-gradient(140deg,#477f8f 0%,#749b91 35%,#243d52 70%,#142131 100%)}@media(max-width:850px){.dock{bottom:9%;padding:12px;flex-wrap:wrap}.app{flex:0 0 23%;min-height:60px}.welcome{bottom:45%}}
</style></head><body><div id="photo" class="fallback"></div><div id="shade"></div><div class="top"><div class="brand">NATURE HOME</div><div class="clock"><div id="time">--:--</div><div class="date" id="date"></div></div></div><div class="welcome"><h1 id="greeting">Welcome home.</h1><p id="scene">Mountains · Forests · Oceans</p></div><nav class="dock" id="dock"><a class="app" href="https://www.netflix.com/">Netflix</a><a class="app" href="https://www.youtube.com/tv">YouTube</a><a class="app" href="https://www.disneyplus.com/">Disney+</a><a class="app" href="https://www.hulu.com/">Hulu</a><a class="app" href="https://www.primevideo.com/">Prime Video</a><a class="app" href="https://www.peacocktv.com/">Peacock</a><a class="app" href="https://play.max.com/">Max</a><a class="app" href="https://open.spotify.com/">Spotify</a></nav><div class="help">Use ◀ ▶ to select · OK to open website · The LG Home button still opens LG Home</div>
<script>
(function(){
var scenes=[
{name:'Mountain air',url:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1600&q=75'},
{name:'Quiet forest',url:'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=75'},
{name:'Open ocean',url:'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?w=1600&q=75'}];
var index=0,links=document.querySelectorAll('.app'),focusIndex=0,photo=document.getElementById('photo');
function wallpaper(){var s=scenes[index];photo.style.backgroundImage='linear-gradient(130deg,rgba(22,66,74,.2),rgba(10,30,48,.2)),url("'+s.url+'")';document.getElementById('scene').textContent=s.name+' · Mountains · Forests · Oceans';index=(index+1)%scenes.length}
function time(){var d=new Date(),h=d.getHours(),m=d.getMinutes();document.getElementById('time').textContent=(h%12||12)+':'+(m<10?'0':'')+m+(h<12?' AM':' PM');document.getElementById('date').textContent=d.toDateString();document.getElementById('greeting').textContent=h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.'}
function choose(i){focusIndex=(i+links.length)%links.length;for(var j=0;j<links.length;j++)links[j].className='app'+(j===focusIndex?' active':'');links[focusIndex].focus()}
document.addEventListener('keydown',function(e){var k=e.keyCode;if(k===37){choose(focusIndex-1);e.preventDefault()}else if(k===39){choose(focusIndex+1);e.preventDefault()}else if(k===13){window.location.href=links[focusIndex].href}});
wallpaper();time();setInterval(wallpaper,60000);setInterval(time,30000);choose(0);
})();
</script></body></html>
